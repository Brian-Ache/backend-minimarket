# =====================================================================
# backend-minimarket — entorno local completo
# =====================================================================
# La API más su MySQL, para trabajar sin instalar MySQL en la máquina:
#
#   cp .env.example .env    # completar JWT_SECRET y DB_PASSWORD
#   docker compose up --build
#
# Compose lee el `.env` del directorio solo: acá no hace falta el `set -a; source .env` que
# sí necesita `./mvnw spring-boot:run`.
#
# **Esto no es el compose de producción.** Siembra la base con `init.sql`, cuyo seed trae usuarios
# de desarrollo con contraseñas conocidas, y publica el puerto de MySQL. El despliegue al VPS
# usa su propio compose, que baja la imagen publicada en vez de construirla (fase B4 del plan
# de la 0.6.0).
# =====================================================================

services:
  api:
    build: .
    image: minimarket:local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # La URL se arma acá y no se toma del `.env` a propósito: la del `.env` apunta a
      # localhost, que adentro del contenedor es el contenedor mismo y no la base.
      DB_URL: "jdbc:mysql://db:3306/minimarket?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8"
      DB_USERNAME: "root"
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en el .env — generalo con openssl rand -base64 48}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      # El esquema se aplica con script/database/init.sql, nunca con Hibernate.
      JPA_DDL_AUTO: "none"
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:1420}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # SMTP de las invitaciones y del reseteo de contraseña. Todo opcional: **sin MAIL_HOST el
      # mail no se manda y queda en el log del contenedor, con el enlace incluido**, que es el
      # modo de desarrollo normal. Pasar la variable vacía no lo rompe: EmailService decide por
      # `spring.mail.host` en blanco y no por la existencia del bean, así que un host vacío cae
      # igual en el log en vez de intentar conectarse a la nada.
      #
      # Los enlaces que viajan adentro se arman con FRONTEND_URL, que va acá arriba: apuntarlo
      # mal manda mails con enlaces que no abren.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_TIMEOUT_MS: ${MAIL_TIMEOUT_MS:-10000}
      MAIL_FROM: ${MAIL_FROM:-no-reply@minimarket.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Minimarket}
      # Sin esto el contenedor corre en UTC y un punto de venta argentino fecharía cada venta,
      # cada movimiento de caja y cada corte tres horas adelantados.
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      # Para poder entrar con un cliente desde la máquina. Si ya tenés un MySQL local en el
      # 3306, cambiá el puerto de afuera con DB_PORT_HOST.
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/utf8mb4.cnf:/etc/mysql/conf.d/utf8mb4.cnf:ro
      # Los scripts de initdb corren una sola vez, cuando el volumen está vacío. `init.sql`
      # trae el esquema y el seed juntos. Para rehacer la base desde cero:
      # docker compose down -v
      - ./script/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # La API no arranca contra una base a medio inicializar: depends_on espera este ping.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
