spring.application.name=minimarket
# 1. Configuración de Base de Datos con el charset UTF-8 correcto
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minimarket?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# 2. Configuración MODERNA para forzar UTF-8 en las respuestas JSON (Spring Boot 3+)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET:}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

