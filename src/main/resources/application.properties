spring.application.name=minimarket
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minimarket?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET:}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Envío de mails (invitaciones y reseteo de contraseña).
# Sin MAIL_HOST no hay bean JavaMailSender y la app no manda nada: deja el mail en el log,
# con el enlace incluido. Es el modo de desarrollo, no hace falta un SMTP para levantar.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}

# Remitente de los mails y base para armar los enlaces que se mandan adentro.
app.mail.remitente=${MAIL_FROM:no-reply@minimarket.local}
app.mail.nombre-remitente=${MAIL_FROM_NAME:Minimarket}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
