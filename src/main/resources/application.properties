spring.application.name=minimarket
# 1. Configuración de Base de Datos con el charset UTF-8 correcto
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minimarket?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# 2. Configuración MODERNA para forzar UTF-8 en las respuestas JSON (Spring Boot 3+)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET:}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Envío de mails (invitaciones y reseteo de contraseña).
# Sin MAIL_HOST no hay bean JavaMailSender y la app no manda nada: deja el mail en el log,
# con el enlace incluido. Es el modo de desarrollo, no hace falta un SMTP para levantar.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}

# Remitente de los mails y base para armar los enlaces que se mandan adentro.
app.mail.remitente=${MAIL_FROM:no-reply@minimarket.local}
app.mail.nombre-remitente=${MAIL_FROM_NAME:Minimarket}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Cuánto tiempo una venta sin cobrar retiene el stock que descontó al armarse. Pasado ese
# plazo, un barrido la anula y devuelve la mercadería. En 0 el barrido queda apagado y las
# ventas sin cobrar viven indefinidamente.
ventas.reserva-stock.minutos=${VENTAS_RESERVA_MINUTOS:120}
ventas.reserva-stock.revision-ms=${VENTAS_RESERVA_REVISION_MS:300000}

# Sincronización de tickets creados sin conexión.
#
# El tope del lote no es por tamaño del payload sino por cuánto tiempo el request retiene la
# base: cada evento es su propia transacción y toma locks de fila sobre stock y lotes. Cuando
# un lote lo supera, la respuesta dice el límite para que el front trocee sin adivinarlo.
sync.lote.maximo=${SYNC_LOTE_MAXIMO:100}

# La fecha de un ticket offline la manda el dispositivo, así que se valida antes de guardarla:
# un reloj mal puesto envenena los reportes, el orden de los uuid v7 y la ventana de anulación.
sync.desfase-maximo-minutos=${SYNC_DESFASE_MAXIMO_MINUTOS:5}
sync.antiguedad-maxima-dias=${SYNC_ANTIGUEDAD_MAXIMA_DIAS:60}

# Actuator: únicamente /actuator/health, y sin detalles.
#
# La ruta es pública —ya estaba en la lista de SecurityConfig— porque la consulta el
# healthcheck del contenedor, que no tiene con qué autenticarse. Por eso no se expone nada
# más: el resto de los endpoints del actuator publicarían el entorno, las variables y las
# rutas del sistema sin pedir token. `never` es lo que evita que el cuerpo del health cuente
# si la base está caída y con qué URL se conecta.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# El estado del SMTP NO cuenta para el health.
#
# El indicador que trae spring-boot-starter-mail abre una conexión al servidor de correo en
# cada consulta, y si falla devuelve el health entero en DOWN con 503. Eso significaría que
# el contenedor queda `unhealthy` —y que un despliegue falla— porque el proveedor de mail
# está lento, cuando vender, cobrar y sincronizar no dependen de él en absoluto. Sin
# MAIL_HOST, que es el modo de desarrollo, ese chequeo falla siempre.
#
# Lo que el health sí mira es la base: sin MySQL la aplicación no puede hacer nada, y ahí
# DOWN es la respuesta correcta.
management.health.mail.enabled=false
