# =====================================================================
# backend-minimarket — nginx del VPS (plantilla)
# =====================================================================
# Reverse proxy al 8080 del contenedor, que solo escucha en loopback. Va en
# /etc/nginx/sites-available/minimarket-api y se enlaza en sites-enabled.
#
# Reemplazar `api.midominio.com` por el dominio real antes de usarlo.
#
# El bloque de TLS lo escribe certbot solo:
#
#   sudo certbot --nginx -d api.midominio.com
#
# Conviene correr certbot con este archivo ya instalado y solo el server del puerto 80: agrega
# el listen 443, las rutas de los certificados y la redirección, sin tocar lo demás.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.midominio.com;

    # Certbot renueva por acá. Todo lo demás se va a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.midominio.com;

    # --- TLS -----------------------------------------------------------
    # Estas cuatro líneas las agrega y las mantiene certbot. Si se corre certbot después de
    # instalar este archivo, se pueden borrar de acá.
    ssl_certificate     /etc/letsencrypt/live/api.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.midominio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Tamaño del request --------------------------------------------
    # El lote de sincronización es el request más grande del sistema: hasta 100 eventos, y
    # cada uno con sus líneas de detalle. El default de nginx es 1m y devolvería 413 justo
    # después de un corte largo, que es el peor momento posible. 10m es holgado de sobra.
    client_max_body_size 10m;
    client_body_timeout  60s;

    # --- Logs -----------------------------------------------------------
    access_log /var/log/nginx/minimarket-api.access.log;
    error_log  /var/log/nginx/minimarket-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Sin estos headers la app ve todas las requests como venidas de 127.0.0.1 y por
        # HTTP, y los enlaces que arma quedan mal.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Un lote de sincronización procesa cada evento en su propia transacción y toma locks
        # de fila sobre stock y lotes: tarda bastante más que un request normal. Con el
        # default de 60s, un lote grande se cortaría del lado de nginx mientras el backend lo
        # sigue procesando, y el front lo reintentaría entero.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # La API responde JSON de una sola pieza: no hay streaming que preservar.
        proxy_buffering on;
    }

    # El healthcheck del contenedor lo consulta por dentro; esta ruta queda abierta para que
    # el paso de verificación del deploy pueda mirarla desde afuera. Es el único endpoint del
    # actuator expuesto y no devuelve detalles: solo UP o DOWN.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Nada más del actuator sale a internet. Hoy no hay nada más expuesto del lado de Spring
    # —management.endpoints.web.exposure.include=health—, así que esto es el segundo cerrojo:
    # si alguien amplía esa lista sin pensar, no queda publicado por accidente.
    location /actuator/ {
        return 404;
    }
}
