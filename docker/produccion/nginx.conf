# =====================================================================
# backend-minimarket — nginx del VPS (plantilla)
# =====================================================================
# Reverse proxy al 8080 del contenedor, que solo escucha en loopback. Va en
# /etc/nginx/sites-available/minimarket-api y se enlaza en sites-enabled.
#
# Son DOS archivos y se instalan juntos: este y nginx-ratelimit.conf, que va en
# /etc/nginx/conf.d/. Las location de /api/auth de acá abajo nombran zonas que se declaran
# allá, así que sin ese archivo nginx no arranca. El motivo de la separación es que
# `limit_req_zone` solo vale en el contexto `http`, y sites-available son bloques `server`.
#
# Reemplazar `api.midominio.com` por el dominio real antes de usarlo.
#
# El bloque de TLS lo escribe certbot solo:
#
#   sudo certbot --nginx -d api.midominio.com
#
# Conviene correr certbot con este archivo ya instalado y solo el server del puerto 80: agrega
# el listen 443, las rutas de los certificados y la redirección, sin tocar lo demás.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.midominio.com;

    # Certbot renueva por acá. Todo lo demás se va a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.midominio.com;

    # --- TLS -----------------------------------------------------------
    # Estas cuatro líneas las agrega y las mantiene certbot. Si se corre certbot después de
    # instalar este archivo, se pueden borrar de acá.
    ssl_certificate     /etc/letsencrypt/live/api.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.midominio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Tamaño del request --------------------------------------------
    # El lote de sincronización es el request más grande del sistema: hasta 100 eventos, y
    # cada uno con sus líneas de detalle. El default de nginx es 1m y devolvería 413 justo
    # después de un corte largo, que es el peor momento posible. 10m es holgado de sobra.
    client_max_body_size 10m;
    client_body_timeout  60s;

    # --- Logs -----------------------------------------------------------
    access_log /var/log/nginx/minimarket-api.access.log;
    error_log  /var/log/nginx/minimarket-api.error.log;

    # --- Proxy ----------------------------------------------------------
    # Declarado a nivel server y no dentro de cada location: las location lo heredan, y así
    # las de /api/auth solo agregan su límite de tasa en vez de repetir todo esto.
    #
    # Ojo con la herencia de nginx: una location que declare UN proxy_set_header propio pierde
    # TODOS los de acá, no solo el que repite. O no declara ninguno, o los declara todos.
    proxy_http_version 1.1;

    # Sin estos headers la app ve todas las requests como venidas de 127.0.0.1 y por
    # HTTP, y los enlaces que arma quedan mal.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Un lote de sincronización procesa cada evento en su propia transacción y toma locks
    # de fila sobre stock y lotes: tarda bastante más que un request normal. Con el
    # default de 60s, un lote grande se cortaría del lado de nginx mientras el backend lo
    # sigue procesando, y el front lo reintentaría entero.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # La API responde JSON de una sola pieza: no hay streaming que preservar.
    proxy_buffering on;

    # --- Login: el único endpoint donde se adivinan credenciales ---------
    # Las zonas se declaran en nginx-ratelimit.conf, que va en conf.d/. Sin ese archivo
    # instalado nginx no arranca y el error no nombra ningún archivo:
    # `[emerg] zero size shared memory zone "minimarket_login"`.
    #
    # El `nodelay` deja pasar el arranque de una en vez de espaciarlo: quien se equivoca de
    # contraseña reintenta enseguida, no a los seis segundos. El techo por minuto no cambia.
    #
    # Match exacto: tiene que ganarle al prefijo /api/auth/ de abajo.
    location = /api/auth/v1/login {
        limit_req zone=minimarket_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # --- Resto de /api/auth: invitaciones y reseteo ----------------------
    # Público como el login, pero acá no se adivina nada: se limita para que nadie use el
    # reseteo como generador de mails, ni para dejar a alguien sin su enlace repitiendo el
    # pedido.
    location /api/auth/ {
        limit_req zone=minimarket_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # El resto de la API queda SIN límite a propósito: el lote de sincronización llega en
    # ráfaga después de un corte, y ponerle techo convertiría la vuelta de la conexión en
    # una tanda de 429.
    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # El healthcheck del contenedor lo consulta por dentro; esta ruta queda abierta para que
    # el paso de verificación del deploy pueda mirarla desde afuera. Es el único endpoint del
    # actuator expuesto y no devuelve detalles: solo UP o DOWN.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        access_log off;
    }

    # Nada más del actuator sale a internet. Hoy no hay nada más expuesto del lado de Spring
    # —management.endpoints.web.exposure.include=health—, así que esto es el segundo cerrojo:
    # si alguien amplía esa lista sin pensar, no queda publicado por accidente.
    location /actuator/ {
        return 404;
    }
}
