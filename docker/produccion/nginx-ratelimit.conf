# =====================================================================
# backend-minimarket — límites de tasa sobre /api/auth (plantilla)
# =====================================================================
# Va en /etc/nginx/conf.d/minimarket-ratelimit.conf, NO en sites-available.
#
# `limit_req_zone` solo es válido en el contexto `http`, y nginx.conf incluye
# conf.d/*.conf ahí; sites-available, en cambio, son bloques `server`. Poner
# estas líneas en la plantilla del sitio hace que nginx no arranque.
#
# Las zonas se declaran acá y se aplican con `limit_req` en las location de
# nginx.conf. Una sin la otra no hace nada: la zona sola no limita, y el
# `limit_req` sin la zona impide el arranque, con un error que no menciona
# ningún archivo y cuesta relacionar:
#
#   nginx: [emerg] zero size shared memory zone "minimarket_login"
#
# Si aparece eso, falta este archivo en conf.d/.
#
# Verificar antes de recargar:
#
#   sudo nginx -t && sudo systemctl reload nginx
# =====================================================================

# --- Login -----------------------------------------------------------
# El endpoint que hay que proteger: es público y prueba contraseñas. Sin esto,
# probar credenciales sale al precio de la latencia de red.
#
# 10 por minuto sostenido, con 10 de arranque inmediato. El arranque está para
# la apertura del local, cuando varios empleados entran a la vez desde la misma
# IP; el sostenido es lo que le pone techo a quien insiste.
limit_req_zone $binary_remote_addr zone=minimarket_login:10m rate=10r/m;

# --- Resto de /api/auth ----------------------------------------------
# Más holgado porque no adivina nada: los tokens son de 256 bits y no se
# aciertan a fuerza de intentos. Se limita por otra razón —el reseteo dispara
# mails, y desde que un pedido nuevo invalida el anterior, repetirlo sirve para
# dejar a alguien sin su enlace de reseteo—.
limit_req_zone $binary_remote_addr zone=minimarket_auth:10m rate=30r/m;

# 429 en vez del 503 que nginx devuelve por defecto: es un límite de tasa, no
# un servicio caído, y el front tiene que poder distinguirlos para reintentar.
limit_req_status 429;

# Que quede en el error log. Un pico acá es la señal de que alguien está
# probando, y es lo único que avisa.
limit_req_log_level warn;

# =====================================================================
# Lo que esto NO resuelve
# =====================================================================
# El límite es POR IP. Eso alcanza para el atacante de una sola máquina, que es
# el caso normal, y no hace nada contra uno distribuido: cada IP nueva trae su
# propia cuota.
#
# Tampoco es un bloqueo de cuenta. A 10 intentos por minuto, un diccionario de
# los mil peores passwords se agota en un par de horas desde una sola IP. Una
# contraseña débil sigue siendo una contraseña débil; contra eso va el bloqueo
# por cuenta, que es otra decisión —y tiene su propio costo: habilita a que
# alguien bloquee cuentas ajenas a propósito—.
# =====================================================================
