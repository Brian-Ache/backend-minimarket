name: CI

# Corre en cada push a las ramas largas y en cada PR contra ellas. Un PR con un test roto
# no se puede mergear: hay que marcar este check como obligatorio en la protección de rama.
#
# Este workflow SOLO compila y testea: no publica imagen ni despliega. Producción es `main`
# y nada más que `main`, así que el build y el deploy viven en sus propios workflows (fases
# B3 y B4 del plan de la 0.6.0) y no se agregan pasos de despliegue acá: este corre también
# en `developer`, que es justo la rama que no tiene que tocar producción.
on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

# Un push nuevo sobre la misma rama cancela el run anterior, que ya no interesa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Casi todos los tests son unitarios con Mockito y corren sin base. El único que necesita MySQL
      # es MinimarketApplicationTests.contextLoads, marcado con @Tag("integracion"):
      # queda excluido hasta que haya tests de integración con Testcontainers.
      - name: Build y tests
        run: ./mvnw -B -ntp verify -DexcludedGroups=integracion

      - name: Reportes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
